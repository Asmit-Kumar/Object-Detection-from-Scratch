name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU-only dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy matplotlib pillow opencv-python-headless

      # Trained weights are not in git, so tests/test_checkpoints.py skips here and runs locally.
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
